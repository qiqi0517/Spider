<div class="list-group-item">
    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3">
        <!-- 正文 -->
        <span class="text-break">{{ comment.text }}</span>
        <div class="d-flex align-items-center ms-sm-3 gap-3 flex-shrink-0">
            <!-- 时间 -->
            <small class="text-muted text-nowrap">
                {{ comment.time|date:"Y-m-d H:i" }}
            </small>
            <!-- 删除 -->
            <form method="post" action="{% url 'delete_comment' comment.id %}" class="mb-0 comment-action-form">
                {% csrf_token %}
                <button type="submit" class="edit-comment-button btn btn-outline-danger btn-sm text-nowrap" onclick="return confirm('确定删除评论？');">
                    删除
                </button>
            </form>
        </div>
    </div>
</div>
